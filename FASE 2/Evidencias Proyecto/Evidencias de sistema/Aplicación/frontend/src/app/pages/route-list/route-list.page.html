<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Lista de Rutas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let ruta of routes" lines="inset">
      <ion-icon name="map-outline" slot="start" color="secondary" (click)="viewRouteDetail(ruta.idRuta)" style="cursor: pointer; font-size: 1.5em; margin-right: 8px;"></ion-icon>
      <ion-label (click)="viewRouteDetail(ruta.idRuta)" style="cursor: pointer;">
        <h2>{{ ruta.nombreRuta }}</h2>
        <p>{{ ruta.descripcionRuta || 'Sin descripción' }}</p>
        <p><small>Puntos: {{ ruta.puntosRuta?.length || 0 }}</small></p>
        <p *ngIf="ruta.kilometrosRuta !== null && ruta.kilometrosRuta !== undefined">
            <small>Distancia: {{ ruta.kilometrosRuta | number:'1.1-2' }} km</small>
        </p>
      </ion-label>

      <div slot="end" class="ion-padding-start">
        <ion-button fill="clear" size="small" (click)="startRouteSimulation(ruta.idRuta, ruta.nombreRuta)" title="Simular Ruta">
          <ion-icon slot="icon-only" name="play-circle-outline" color="success"></ion-icon>
        </ion-button>
        <ion-button fill="clear" size="small" (click)="editRoute(ruta.idRuta)" title="Editar Ruta">
          <ion-icon slot="icon-only" name="pencil-outline" color="warning"></ion-icon>
        </ion-button>
        <ion-button fill="clear" size="small" (click)="confirmDeleteRoute(ruta.idRuta, ruta.nombreRuta)" title="Eliminar Ruta">
          <ion-icon slot="icon-only" name="trash-outline" color="danger"></ion-icon>
        </ion-button>
      </div>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/rutas/nueva"> 
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
