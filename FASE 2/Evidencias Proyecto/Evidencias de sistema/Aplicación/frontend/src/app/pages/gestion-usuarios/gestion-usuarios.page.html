

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestión de Usuarios</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-toolbar>
    <ion-searchbar
      animated="true"
      placeholder="Buscar por nombre o email..."
      (ionInput)="handleSearch($event)"
    ></ion-searchbar>
  </ion-toolbar>

  <ion-segment (ionChange)="filterByRole($event)" [(ngModel)]="selectedRole" scrollable="true">
    <ion-segment-button value="todos">
      <ion-label>Todos</ion-label>
    </ion-segment-button>
    <ion-segment-button *ngFor="let rol of rolesParaFiltrar" [value]="rol">
      <ion-label>{{ rol | titlecase }}</ion-label>
    </ion-segment-button>
  </ion-segment>
  
  <div *ngIf="cargando">
    <ion-list>
      <ion-card *ngFor="let item of skeletonItems" class="skeleton-card">
        <ion-card-header>
          <ion-skeleton-text animated="true" style="width: 60%;"></ion-skeleton-text>
        </ion-card-header>
        <ion-card-content>
          <ion-skeleton-text animated="true" style="width: 80%;"></ion-skeleton-text>
          <ion-skeleton-text animated="true" style="width: 40%;"></ion-skeleton-text>
        </ion-card-content>
      </ion-card>
    </ion-list>
  </div>

  <div *ngIf="error" class="ion-padding ion-text-center">
    <ion-text color="danger"><p>No se pudo cargar la información.</p></ion-text>
    <ion-button (click)="cargarUsuarios()"><ion-icon name="refresh-outline" slot="start"></ion-icon>Reintentar</ion-button>
  </div>

  <ion-list *ngIf="!cargando && !error">
    <ion-card *ngFor="let usuario of resultadosFiltrados" class="usuario-card">
      <ion-card-header>
        <ion-card-title>
          <ion-icon [name]="getIconForRole(usuario.rol)" color="primary"></ion-icon>
          {{ usuario.pri_nom_usu }} {{ usuario.pri_ape_usu }}
        </ion-card-title>
        <ion-card-subtitle>{{ usuario.email }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-chip [color]="getColorForRole(usuario.rol)" outline="true">
          <ion-label>{{ usuario.rol | titlecase }}</ion-label>
        </ion-chip>
      </ion-card-content>

      <div class="card-buttons">
        <ion-button fill="clear" color="primary" (click)="onEdit(usuario)">
          <ion-icon slot="start" name="create-outline"></ion-icon>
          Editar
        </ion-button>
        <ion-button fill="clear" color="danger" (click)="onDelete(usuario)">
          <ion-icon slot="start" name="trash-outline"></ion-icon>
          Borrar
        </ion-button>
      </div>
    </ion-card>
  </ion-list>

  <div *ngIf="!cargando && resultadosFiltrados.length === 0" class="ion-text-center ion-padding">
    <p>No se encontraron usuarios.</p>
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="onCreate()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
