<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Header Component -->
  <app-page-header 
    title="Dashboard - Sistema de Flotas"
    [showButton]="false">
  </app-page-header>

  <!-- Refresher -->
  <ion-refresher slot="fixed">
    <ion-refresher-content 
      pullingIcon="chevron-down"
      pullingText="Desliza hacia abajo para actualizar"
      refreshingSpinner="crescent"
      refreshingText="Actualizando...">
    </ion-refresher-content>
  </ion-refresher>

  <!-- Contenido Principal -->
  <ion-grid>
    <ion-row>
      <!-- Gráfico de Tipos de Vehículo (ya existente) -->
      <ion-col size="12" size-md="6" size-lg="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Tipos de Vehículo</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div *ngIf="isPieChartLoading" class="ion-text-center ion-padding">
              <ion-spinner name="crescent"></ion-spinner>
            </div>
            <div *ngIf="!isPieChartLoading && pieChartData.datasets[0].data.length > 0">
              <canvas baseChart 
                [data]="pieChartData"
                [type]="pieChartType"
                [options]="pieChartOptions">
              </canvas>
            </div>
            <div *ngIf="!isPieChartLoading && pieChartData.datasets[0].data.length === 0" class="ion-text-center ion-padding">
              <p>No hay datos de vehículos.</p>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Nuevo Gráfico de Estado de Mantenimientos -->
      <ion-col size="12" size-md="6" size-lg="4">
        <ion-card>
          <ion-card-header>
            <ion-card-title>Estado Mantenimientos</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div *ngIf="isBarChartLoading" class="ion-text-center ion-padding">
              <ion-spinner name="crescent"></ion-spinner>
            </div>
            <div *ngIf="!isBarChartLoading && barChartData.datasets[0].data.length > 0">
              <canvas baseChart 
                [data]="barChartData"
                [type]="barChartType"
                [options]="barChartOptions">
              </canvas>
            </div>
             <div *ngIf="!isBarChartLoading && barChartData.datasets[0].data.length === 0" class="ion-text-center ion-padding">
              <p>No hay datos de mantenimientos.</p>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
