<ion-header>
  <ion-toolbar color="tertiary">
    <ion-buttons slot="start">
       <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Mis Servicios Asignados</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="isLoading" class="ion-text-center ion-padding">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && ordenes.length === 0" class="empty-state">
    <ion-icon name="hammer-outline" size="large"></ion-icon>
    <p>No tienes órdenes de trabajo asignadas.</p>
  </div>

  <ion-list *ngIf="!isLoading && ordenes.length > 0" [inset]="true">
    <ion-card *ngFor="let ot of ordenes" [routerLink]="['/servicio-detalle-movil', ot.id_ot]" button class="ot-card">
      <ion-card-header>
        <ion-card-subtitle>OT #{{ ot.id_ot }}</ion-card-subtitle>
        <ion-card-title>{{ ot.vehiculo.marca }} {{ ot.vehiculo.modelo }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item lines="none">
          <ion-icon name="keypad-outline" slot="start" color="medium"></ion-icon>
          <ion-label>Patente: <strong>{{ ot.vehiculo.patente }}</strong></ion-label>
        </ion-item>
        <ion-item lines="none">
           <ion-icon name="information-circle-outline" slot="start" color="medium"></ion-icon>
           <ion-label>Estado: 
             <ion-chip [outline]="true" [color]="ot.estado_ot === 'en_progreso' ? 'warning' : 'medium'">
                {{ ot.estado_ot }}
             </ion-chip>
           </ion-label>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
