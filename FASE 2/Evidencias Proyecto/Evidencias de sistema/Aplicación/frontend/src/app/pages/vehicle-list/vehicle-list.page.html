<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Header Component -->
  <app-page-header 
    title="Gestión de Vehículos"
    buttonText="Crear Nuevo Vehículo"
    buttonIcon="add-circle-outline"
    (buttonClick)="goToAddVehicle()">
  </app-page-header>

  <!-- Refresher para actualizar datos -->
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Estado de Carga -->
  <div *ngIf="isLoading" class="ion-text-center ion-padding-top">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando vehículos...</p>
  </div>

  <!-- Tabla de datos (solo se muestra si no está cargando y hay vehículos) -->
  <div class="data-table-container" *ngIf="!isLoading && vehiculos.length > 0">

    
    <app-data-table 
      [columns]="tableColumns"
      [data]="vehiculos"
      [pageSize]="pageSize"
      [actionButtons]="actionButtons"
      
    
      [totalItems]="vehiculos.length"  
      [showPagination]="true"          
      [showExport]="true"
      [showImport]="true"

      (page)="onPageChange($event)"    
      (rowClick)="onRowClick($event)"
      (sort)="onSortColumn($event)"
      (export)="onExport($event)"
      (import)="onImport($event)">
    </app-data-table>
  </div>
</ion-content>
