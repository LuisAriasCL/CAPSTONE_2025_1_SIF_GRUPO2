<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Estado de Carga -->
  <div *ngIf="isLoading" class="ion-text-center ion-padding-top">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando vehículos...</p>
  </div>

  <!-- Estado Vacío -->
  <div
    *ngIf="!isLoading && vehiculos.length === 0"
    class="ion-text-center ion-padding-top"
  >
    <ion-icon
      name="car-sport-outline"
      style="font-size: 4em"
      color="medium"
    ></ion-icon>
    <p>No hay vehículos registrados.</p>
    <ion-button
      expand="block"
      (click)="goToAddVehicle()"
      class="ion-margin-top"
    >
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Registrar Primer Vehículo
    </ion-button>
  </div>
  <!-- Tabla de datos (solo se muestra si no está cargando y hay vehículos) -->
  <div class="data-table-container" *ngIf="!isLoading && vehiculos.length > 0">
    <app-data-table
      [columns]="tableColumns"
      [data]="vehiculos"
      [pageSize]="pageSize"
      [actionButtons]="actionButtons"
      [totalItems]="vehiculos.length"
      [showPagination]="true"
      [showExport]="true"
      [showImport]="true"
      (page)="onPageChange($event)"
      (rowClick)="onRowClick($event)"
      (sort)="onSortColumn($event)"
      (export)="onExport($event)"
      (import)="onImport($event)"
    >
    </app-data-table>
  </div>
  <!-- Botón flotante para agregar vehículo -->
  <ion-fab
    vertical="top"
    horizontal="end"
    slot="fixed"
    style="top: 80px; right: 16px"
  >
    <ion-fab-button
      (click)="goToAddVehicle()"
      style="--background: #008000; --color: white"
      size="small"
    >
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
