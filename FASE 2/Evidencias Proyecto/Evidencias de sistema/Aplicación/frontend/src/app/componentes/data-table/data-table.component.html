<div class="data-table-container">
  <!-- Área de exportación modular -->
  <app-table-export
    [showExport]="showExport"
    [showImport]="showImport"
    (exportAction)="onExportClick($event)"
    (importAction)="onImportClick($event)"
  >
  </app-table-export>

  <!-- Tabla principal con clase data-table para aplicar estilos -->
  <table
    [id]="tableId"
    [class]="'data-table ' + (tableClass || '')"
    role="table"
  >
    <!-- Header modular con ordenamiento -->
    <app-table-header
      [columns]="columns"
      [sortColumn]="sortColumn"
      [sortDirection]="sortDirection"
      (sortChange)="onSortChange($event)"
    >
    </app-table-header>

    <tbody>
      <!-- Iterar sobre 'data' que ya viene paginada -->
      <tr *ngFor="let row of data" (click)="onRowClickMethod(row)" role="row">
        <td
          *ngFor="let column of columns"
          [ngClass]="getCellClass(column, row)"
          role="cell"
        >
          <span
            *ngIf="!column.isAction"
            [innerHTML]="renderCell(column, row)"
          ></span>
          <!-- Lógica para botones de acción -->
          <ng-container *ngIf="column.isAction && actionButtons.length > 0">
            <ion-button
              *ngFor="let btn of actionButtons"
              [color]="btn.color"
              (click)="$event.stopPropagation(); btn.onClick(row)"
              [title]="btn.tooltip"
              fill="clear"
              size="small"
              [class]="btn.cssClass || ''"
            >
              <ion-icon [name]="btn.icon" slot="icon-only"></ion-icon>
            </ion-button>
          </ng-container>
        </td>
      </tr>
      <tr *ngIf="!hasData()">
        <td [attr.colspan]="columns.length" class="no-data">
          {{ NULL_DATA }}
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Paginación modular -->
  <app-table-pagination
    *ngIf="showPagination && totalItems > 0 && totalPages > 0"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    [totalItems]="totalItems"
    [maxVisiblePages]="MAX_VISIBLE_PAGES"
    (pageChange)="onPageChange($event)"
  >
  </app-table-pagination>
</div>
