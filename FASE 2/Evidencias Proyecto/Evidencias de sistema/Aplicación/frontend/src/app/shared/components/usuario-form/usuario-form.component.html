<app-modal-header 
  [title]="isEditMode ? 'Editar Usuario' : 'Nuevo Usuario'"
  (close)="cancel()">
</app-modal-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="confirm()" novalidate>
    <ion-list lines="none">
      
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="floating"
          formControlName="pri_nom_usu"
          required
          fill="outline"
          shape="round"
          [class.ion-invalid]="form.get('pri_nom_usu')?.invalid && form.get('pri_nom_usu')?.touched"
        ></ion-input>
      </ion-item>      <div class="error-container" *ngIf="form.get('pri_nom_usu')?.invalid && form.get('pri_nom_usu')?.touched">
        <ion-text color="danger">
          {{ getFieldErrorMessage('pri_nom_usu') }}
        </ion-text>
      </div>

      <ion-item>
        <ion-input
          label="Apellido"
          labelPlacement="floating"
          formControlName="pri_ape_usu"
          required
          fill="outline"
          shape="round"
          [class.ion-invalid]="form.get('pri_ape_usu')?.invalid && form.get('pri_ape_usu')?.touched"
        ></ion-input>
      </ion-item>
      <div class="error-container" *ngIf="form.get('pri_ape_usu')?.invalid && form.get('pri_ape_usu')?.touched">
        <ion-text color="danger">
          {{ getFieldErrorMessage('pri_ape_usu') }}
        </ion-text>
      </div>

      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="floating"
          type="email"
          formControlName="email"
          required
          fill="outline"
          shape="round"
          [class.ion-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        ></ion-input>
      </ion-item>      <div class="error-container" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
        <ion-text color="danger">
          {{ getFieldErrorMessage('email') }}
        </ion-text>
      </div>

      <ion-item>
        <ion-select
          label="Rol"
          labelPlacement="floating"          
          formControlName="rol"
          interface="popover"
          placeholder="Seleccione un rol"
          required
          fill="outline"
          shape="round"
          [compareWith]="compareWith"
          [class.ion-invalid]="form.get('rol')?.invalid && form.get('rol')?.touched"
        >
          <ion-select-option *ngFor="let option of constants.ROLES" [value]="option.value">
            {{ option.label }}
          </ion-select-option>
        </ion-select>
      </ion-item>
      <div class="error-container" *ngIf="form.get('rol')?.invalid && form.get('rol')?.touched">
        <ion-text color="danger">
          {{ getFieldErrorMessage('rol') }}
        </ion-text>
      </div>

      <ion-item *ngIf="!isEditMode">
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="clave"
          required
          fill="outline"
          shape="round"
          [class.ion-invalid]="form.get('clave')?.invalid && form.get('clave')?.touched"
        ></ion-input>
      </ion-item>
      <div class="error-container" *ngIf="form.get('clave')?.invalid && form.get('clave')?.touched">
        <ion-text color="danger">
          {{ getFieldErrorMessage('clave') }}
        </ion-text>
      </div>

    </ion-list>
    
    <app-modal-footer
      [submitLabel]="isEditMode ? 'Actualizar Usuario' : 'Crear Usuario'"
      [icon]="isEditMode ? 'save' : 'add'"
      [isDisabled]="form.invalid"
      [submitType]="'submit'"
      [showCancel]="false"
      (submit)="confirm()">
    </app-modal-footer>
  </form>
</ion-content>
